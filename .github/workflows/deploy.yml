name: Deploy Website to GitHub Pages

on:
  push:
    branches:
      - main  # Triggers automatically whenever you push code to the main branch

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # SECURE KEY INJECTION: Replaces placeholders in your JS file with your real GitHub Secrets
      - name: Inject Supabase Credentials
        run: |
          sed -i "s|YOUR_SUPABASE_URL|${{ secrets.SUPABASE_URL }}|g" js/app.js
          sed -i "s|YOUR_SUPABASE_ANON_KEY|${{ secrets.SUPABASE_ANON_KEY }}|g" js/app.js

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Uploads the entire folder root

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4